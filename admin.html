<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - PMR UKS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      min-height: 100vh;
      padding: 20px;
      color: #2d3748;
    }

    .hidden { display: none !important; }

    .login-card {
      background: white;
      max-width: 380px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .login-card h2 { color: #ff7e5f; margin-bottom: 20px; font-weight: 700; }
    .form-control { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
      border: none;
      color: white;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    /* DASHBOARD */
    .dashboard-header {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .container-drag {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .box-drag {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      min-height: 400px;
    }

    .box-drag h3 { font-size: 16px; margin-bottom: 10px; color: #2b6cb0; display: flex; justify-content: space-between; align-items: center; }

    .drag-item {
      background: white;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 10px;
      cursor: grab;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      border-left: 4px solid #4299e1;
      transition: transform 0.15s;
    }

    .drag-item:hover { transform: scale(1.01); }

    .badge-fase { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; }
    .fase-e { background: #ebf8ff; color: #2b6cb0; }
    .fase-f { background: #faf5ff; color: #6b46c1; }

    .drop-zone {
      min-height: 320px;
      background: #f7fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <!-- LOGIN PANEL -->
  <div id="login-section" class="login-card">
    <h2>🔐 Admin Login</h2>
    <input type="text" id="admin-user" class="form-control" value="Obed Rifaldy Sitanggang">
    <input type="password" id="admin-pass" class="form-control" placeholder="Masukkan Password">
    <button onclick="loginAdmin()" class="btn-login">Masuk Dashboard</button>
    <p id="login-err" style="color: #e53e3e; font-size: 12px; margin-top: 10px;"></p>
  </div>

  <!-- DASHBOARD PANEL -->
  <div id="admin-dashboard" class="hidden">
    <div class="dashboard-header">
      <div>
        <h2 style="color: #2b6cb0;">Panel Susun Piket PMR</h2>
        <p style="font-size: 13px; color: #718096;">Penanggung Jawab: <b>Obed Rifaldy Sitanggang</b></p>
      </div>

      <div>
        <label style="font-size: 13px; font-weight: 600; margin-right: 8px;">Pilih Hari:</label>
        <select id="select-hari" class="form-control" style="width: auto; display: inline-block;">
          <option value="Senin">Senin</option>
          <option value="Selasa">Selasa</option>
          <option value="Rabu">Rabu</option>
          <option value="Kamis">Kamis</option>
          <option value="Jumat">Jumat (Khusus Istirahat 1)</option>
        </select>
      </div>
    </div>

    <!-- DRAG AREA -->
    <div class="container-drag">
      <!-- POOL DAFTAR MEMBER -->
      <div class="box-drag">
        <h3>👥 Master Member PMR</h3>
        <input type="text" id="search-input" class="form-control" placeholder="🔍 Cari nama anggota..." onkeyup="filterMember()">
        <div id="pool-member" class="drop-zone" style="max-height: 450px; overflow-y: auto;"></div>
      </div>

      <!-- SLOT ISTIRAHAT 1 -->
      <div class="box-drag">
        <h3 style="color: #dd6b20;">☀️ Shift Istirahat 1</h3>
        <div id="slot-ist-1" class="drop-zone"></div>
      </div>

      <!-- SLOT ISTIRAHAT 2 -->
      <div class="box-drag" id="box-ist-2">
        <h3 style="color: #3182ce;">🌤️ Shift Istirahat 2</h3>
        <div id="slot-ist-2" class="drop-zone"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dnyelqaypfftwswwyure.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRueWVscWF5cGZmdHdzd3d5dXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjY2NzgsImV4cCI6MjEwMjU0MjY3OH0.pce4AoBsxXXUIq5iTjg1PsXWPWmE9OyC_zrH91V5rvg";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function loginAdmin() {
      const user = document.getElementById('admin-user').value;
      const pass = document.getElementById('admin-pass').value;

      if(user.trim() === "Obed Rifaldy Sitanggang" && pass === "obed123") {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        initDragAndDrop();
        loadMembersAdmin();
      } else {
        document.getElementById('login-err').innerText = "Password salah!";
      }
    }

    async function loadMembersAdmin() {
      const { data } = await supabase.from('members').select('*').order('nama', { ascending: true });
      const pool = document.getElementById('pool-member');
      pool.innerHTML = '';
      if(data) {
        data.forEach(m => {
          const badgeClass = m.fase === 'E' ? 'fase-e' : 'fase-f';
          pool.innerHTML += `
            <div class="drag-item" data-id="${m.id}" data-name="${m.nama.toLowerCase()}">
              <span>${m.nama}</span>
              <span class="badge-fase ${badgeClass}">Fase ${m.fase}</span>
            </div>`;
        });
      }
    }

    function filterMember() {
      const keyword = document.getElementById('search-input').value.toLowerCase();
      const items = document.querySelectorAll('#pool-member .drag-item');
      items.forEach(item => {
        const name = item.getAttribute('data-name');
        item.style.display = name.includes(keyword) ? 'flex' : 'none';
      });
    }

    function initDragAndDrop() {
      new Sortable(document.getElementById('pool-member'), { group: 'piket', animation: 150 });
      new Sortable(document.getElementById('slot-ist-1'), { group: 'piket', animation: 150 });
      new Sortable(document.getElementById('slot-ist-2'), { group: 'piket', animation: 150 });
    }

    document.getElementById('select-hari').addEventListener('change', (e) => {
      document.getElementById('box-ist-2').style.display = e.target.value === 'Jumat' ? 'none' : 'block';
    });
  </script>
</body>
</html>
