<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Piket UKS PMR</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      min-height: 100vh;
      padding: 20px;
      color: #2d3748;
    }

    .container { max-width: 900px; margin: 0 auto; }

    .header-card {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .header-card h1 { color: #8e2de2; font-size: 22px; font-weight: 700; }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .card h2 { font-size: 16px; color: #3182ce; margin-bottom: 12px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      margin-bottom: 10px;
    }

    /* Drag & Drop Areas */
    .drag-box {
      min-height: 140px;
      background: #f8fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 10px;
      padding: 10px;
    }

    .shift-target {
      min-height: 120px;
      background: #ebf8ff;
      border: 2px dashed #63b3ed;
      border-radius: 10px;
      padding: 10px;
      margin-top: 5px;
    }

    .draggable-card {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: grab;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .draggable-card:active { cursor: grabbing; background: #edf2f7; }

    .badge {
      background: #ebf8ff;
      color: #3182ce;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .btn-gradient {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
      color: white;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-gradient:hover { opacity: 0.95; }

    .btn-blue {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <h1>⚙️ Kelola Jadwal Piket UKS</h1>
      <p style="font-size: 12px; color: #555;">Panel Admin Susun Shift & Terbitkan Jadwal</p>
    </div>

    <!-- TAMBAH ANGGOTA -->
    <div class="card">
      <h2>➕ Tambah Anggota PMR Baru</h2>
      <div class="grid-2">
        <input type="text" id="nama-baru" class="form-control" placeholder="Nama Lengkap Siswa" style="margin-bottom: 0;">
        <div style="display: flex; gap: 8px;">
          <select id="fase-baru" class="form-control" style="margin-bottom: 0; width: 40%;">
            <option value="E">Fase E</option>
            <option value="F">Fase F</option>
          </select>
          <button type="button" class="btn-gradient btn-blue" style="margin-top:0;" onclick="tambahAnggota()">Simpan</button>
        </div>
      </div>
    </div>

    <!-- DRAG AND DROP PANEL (2 SHIFT) -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>📌 Susun Jadwal Piket</h2>
        <select id="select-hari" class="form-control" style="width: auto; margin-bottom: 0;" onchange="loadJadwalHariIni()">
          <option value="Senin">Senin</option>
          <option value="Selasa">Selasa</option>
          <option value="Rabu">Rabu</option>
          <option value="Kamis">Kamis</option>
          <option value="Jumat">Jumat</option>
        </select>
      </div>

      <div class="grid-2">
        <!-- LIST ANGGOTA (SOURCE) -->
        <div>
          <label style="font-size: 12px; font-weight: bold; color: #4a5568;">📇 Daftar Anggota (Tarik nama ke Shift):</label>
          <div id="source-list" class="drag-box" style="margin-top: 5px;" ondrop="drop(event, 'source')" ondragover="allowDrop(event)">
            <!-- List Anggota Muncul di Sini -->
          </div>
        </div>

        <!-- 2 KOTAK SHIFT (TARGET) -->
        <div>
          <label style="font-size: 12px; font-weight: bold; color: #2b6cb0;">⏰ Shift Istirahat 1:</label>
          <div id="target-shift-1" class="shift-target" ondrop="drop(event, 'Shift Istirahat 1')" ondragover="allowDrop(event)"></div>

          <label style="font-size: 12px; font-weight: bold; color: #2b6cb0; margin-top: 10px; display: block;">⏰ Shift Istirahat 2:</label>
          <div id="target-shift-2" class="shift-target" ondrop="drop(event, 'Shift Istirahat 2')" ondragover="allowDrop(event)"></div>
        </div>
      </div>

      <!-- TOMBOL TERBITKAN -->
      <button type="button" class="btn-gradient" onclick="terbitkanJadwal()">🚀 Terbitkan Jadwal Hari Ini</button>
      <div id="status-terbit" style="margin-top: 10px; font-size: 13px; font-weight: bold; text-align: center;"></div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://dnyelqaypfftwswwyure.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRueWVscWF5cGZmdHdzd3d5dXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjY2NzgsImV4cCI6MjEwMjU0MjY3OH0.pce4AoBsxXXUIq5iTjg1PsXWPWmE9OyC_zrH91V5rvg";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let membersAll = [];

    async function init() {
      await loadMembers();
      await loadJadwalHariIni();
    }

    // Load semua anggota dari Supabase
    async function loadMembers() {
      const { data } = await supabase.from('members').select('*').order('nama');
      membersAll = data || [];
    }

    // Render ulang list kiri (hanya anggota yang belum dimasukkan ke shift)
    function renderSourceList() {
      const sourceBox = document.getElementById('source-list');
      sourceBox.innerHTML = '';

      const selectedIds = Array.from(document.querySelectorAll('.shift-target .draggable-card')).map(el => el.dataset.id);

      membersAll.forEach(m => {
        if (!selectedIds.includes(m.id.toString())) {
          sourceBox.appendChild(createMemberCard(m.id, m.nama, m.fase));
        }
      });
    }

    // Buat Kartu Anggota
    function createMemberCard(id, nama, fase) {
      const div = document.createElement('div');
      div.className = 'draggable-card';
      div.draggable = true;
      div.id = `member-${id}`;
      div.dataset.id = id;

      div.ondragstart = (e) => {
        e.dataTransfer.setData("text/plain", id);
      };

      div.innerHTML = `
        <span><b>${nama}</b></span>
        <span class="badge">Fase ${fase}</span>
      `;
      return div;
    }

    // Drag & Drop Handlers
    function allowDrop(e) {
      e.preventDefault();
    }

    function drop(e, targetZone) {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain");
      const card = document.getElementById(`member-${id}`);

      if (!card) return;

      if (targetZone === 'Shift Istirahat 1') {
        document.getElementById('target-shift-1').appendChild(card);
      } else if (targetZone === 'Shift Istirahat 2') {
        document.getElementById('target-shift-2').appendChild(card);
      } else {
        document.getElementById('source-list').appendChild(card);
      }
    }

    // FUNGSI UTAMA: TERBITKAN JADWAL
    async function terbitkanJadwal() {
      const hari = document.getElementById('select-hari').value;
      const status = document.getElementById('status-terbit');

      status.style.color = "#3182ce";
      status.innerText = "⏳ Sedang menerbitkan...";

      const shift1Cards = document.querySelectorAll('#target-shift-1 .draggable-card');
      const shift2Cards = document.querySelectorAll('#target-shift-2 .draggable-card');

      if (shift1Cards.length === 0 && shift2Cards.length === 0) {
        status.style.color = "#e53e3e";
        status.innerText = "⚠️ Geser minimal 1 anggota ke Shift 1 atau Shift 2!";
        return;
      }

      // 1. Susun Payload Data
      const payload = [];

      shift1Cards.forEach(c => {
        payload.push({ hari: hari, member_id: c.dataset.id, shift: 'Shift Istirahat 1' });
      });

      shift2Cards.forEach(c => {
        payload.push({ hari: hari, member_id: c.dataset.id, shift: 'Shift Istirahat 2' });
      });

      // 2. Hapus jadwal lama untuk hari ini di Supabase
      await supabase.from('piket_schedule').delete().eq('hari', hari);

      // 3. Masukkan jadwal baru
      const { error } = await supabase.from('piket_schedule').insert(payload);

      if (error) {
        status.style.color = "#e53e3e";
        status.innerText = "❌ Gagal Terbit: " + error.message;
      } else {
        status.style.color = "#38a169";
        status.innerText = "✅ Jadwal " + hari + " Berhasil Diterbitkan!";
      }
    }

    // Load jadwal berdasarkan hari terpilih
    async function loadJadwalHariIni() {
      const hari = document.getElementById('select-hari').value;
      const s1 = document.getElementById('target-shift-1');
      const s2 = document.getElementById('target-shift-2');
      document.getElementById('status-terbit').innerText = '';

      s1.innerHTML = '';
      s2.innerHTML = '';

      const { data } = await supabase.from('piket_schedule').select('*').eq('hari', hari);

      if (data && data.length > 0) {
        data.forEach(item => {
          const member = membersAll.find(m => m.id.toString() === item.member_id.toString());
          if (member) {
            const card = createMemberCard(member.id, member.nama, member.fase);
            if (item.shift === 'Shift Istirahat 1') {
              s1.appendChild(card);
            } else {
              s2.appendChild(card);
            }
          }
        });
      }

      renderSourceList();
    }

    // Tambah Anggota Baru
    async function tambahAnggota() {
      const nama = document.getElementById('nama-baru').value.trim();
      const fase = document.getElementById('fase-baru').value;

      if (!nama) return alert("Masukkan nama anggota!");

      await supabase.from('members').insert([{ nama, fase }]);
      document.getElementById('nama-baru').value = '';
      
      await loadMembers();
      renderSourceList();
    }

    // Deteksi Hari Ini
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const today = days[new Date().getDay()];
    if (document.querySelector(`#select-hari option[value="${today}"]`)) {
      document.getElementById('select-hari').value = today;
    }

    init();
  </script>
</body>
</html>
