<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absen Piket UKS - PMR</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      min-height: 100vh;
      padding: 15px;
      color: #2d3748;
    }

    .container { max-width: 800px; margin: 0 auto; }

    .header-card {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .header-card h1 { color: #8e2de2; font-size: 22px; font-weight: 700; }
    .header-card p { color: #555; font-size: 13px; }

    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .card h2 { font-size: 16px; color: #3182ce; margin-bottom: 12px; }

    .table-responsive { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #edf2f7; color: #4a5568; padding: 10px; font-size: 12px; text-transform: uppercase; }
    td { padding: 10px; font-size: 13px; border-bottom: 1px solid #edf2f7; }

    .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; }
    .badge-fase { background: #ebf8ff; color: #3182ce; }
    .status-belum { background: #fff5f5; color: #e53e3e; }
    .status-sudah { background: #f0fff4; color: #38a169; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #4a5568; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 13px; background: white; outline: none; }

    .btn-gradient {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
      color: white;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <h1>🏥 Piket UKS PMR</h1>
      <p>Jadwal Pertugasan & Absensi Harian</p>
    </div>

    <!-- TABEL JADWAL HARIAN -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2>📅 Jadwal Piket Harian</h2>
        <select id="filter-hari" class="form-control" style="width: auto; padding: 4px 8px;" onchange="loadScheduleSiswa()">
          <option value="Senin">Senin</option>
          <option value="Selasa">Selasa</option>
          <option value="Rabu">Rabu</option>
          <option value="Kamis">Kamis</option>
          <option value="Jumat">Jumat</option>
        </select>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nama Petugas</th>
              <th>Fase</th>
              <th>Shift</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tabel-piket">
            <tr><td colspan="4" style="text-align: center; color: #a0aec0;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- UPLOAD FORM BUKTI -->
    <div class="card">
      <h2>📸 Absen Foto Bukti Piket</h2>
      <form id="form-upload">
        <div class="form-group">
          <label>Nama Anggota (Sesuai Jadwal Hari Ini):</label>
          <select id="select-member" class="form-control" required>
            <option value="">-- Pilih Nama Kamu --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Shift Istirahat:</label>
          <select id="select-shift" class="form-control" required>
            <option value="Istirahat 1">Shift Istirahat 1</option>
            <option value="Istirahat 2">Shift Istirahat 2</option>
          </select>
        </div>

        <div class="form-group">
          <label>Foto Bukti Piket:</label>
          <input type="file" id="input-foto" class="form-control" accept="image/*" required>
        </div>

        <button type="submit" class="btn-gradient">Kirim Laporan Piket</button>
      </form>
      <div id="pesan-status" style="margin-top: 8px; text-align: center; font-size: 12px; font-weight: 600;"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dnyelqaypfftwswwyure.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRueWVscWF5cGZmdHdzd3d5dXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjY2NzgsImV4cCI6MjEwMjU0MjY3OH0.pce4AoBsxXXUIq5iTjg1PsXWPWmE9OyC_zrH91V5rvg";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadScheduleSiswa() {
      const hari = document.getElementById('filter-hari').value;
      const tbody = document.getElementById('tabel-piket');
      const selectMember = document.getElementById('select-member');

      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #a0aec0;">Memuat jadwal...</td></tr>';
      selectMember.innerHTML = '<option value="">-- Pilih Nama Kamu --</option>';

      // Ambil Jadwal Piket sesuai hari
      const { data, error } = await supabase
        .from('piket_schedule')
        .select(`
          member_id,
          shift,
          members ( id, nama, fase )
        `)
        .eq('hari', hari);

      if (error || !data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #a0aec0;">Belum ada jadwal piket untuk hari ' + hari + '</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      // Tampilkan ke Tabel dan Dropdown Absen
      data.forEach(item => {
        if (item.members) {
          tbody.innerHTML += `
            <tr>
              <td><b>${item.members.nama}</b></td>
              <td><span class="badge badge-fase">Fase ${item.members.fase}</span></td>
              <td>${item.shift}</td>
              <td><span class="badge status-belum">Belum Piket</span></td>
            </tr>
          `;

          // Masukkan ke Dropdown Absen
          selectMember.innerHTML += `<option value="${item.members.id}">${item.members.nama} (${item.shift})</option>`;
        }
      });
    }

    // Submit Laporan Foto Piket
    document.getElementById('form-upload').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusPesan = document.getElementById('pesan-status');
      statusPesan.style.color = "#3182ce";
      statusPesan.innerText = "⏳ Sedang mengunggah foto...";

      const memberId = document.getElementById('select-member').value;
      const shift = document.getElementById('select-shift').value;
      const file = document.getElementById('input-foto').files[0];

      if (!memberId) {
        statusPesan.style.color = "#e53e3e";
        statusPesan.innerText = "❌ Pilih nama anggota terlebih dahulu!";
        return;
      }

      const fileName = `${Date.now()}_${file.name}`;
      const { error: uploadErr } = await supabase.storage.from('bukti-piket').upload(fileName, file);

      if (uploadErr) {
        statusPesan.style.color = "#e53e3e";
        statusPesan.innerText = "❌ Gagal upload foto. Pastikan bucket 'bukti-piket' sudah diset ke Public di Supabase!";
        return;
      }

      const fotoUrl = `${SUPABASE_URL}/storage/v1/object/public/bukti-piket/${fileName}`;

      await supabase.from('piket_logs').insert([{
        member_id: memberId,
        shift: shift,
        foto_url: fotoUrl,
        status: 'Menunggu Tanggapan Admin'
      }]);

      statusPesan.style.color = "#38a169";
      statusPesan.innerText = "✅ Laporan piket berhasil dikirim!";
      document.getElementById('form-upload').reset();
    });

    // Deteksi Hari Ini Secara Otomatis
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const today = days[new Date().getDay()];
    if (document.querySelector(`#filter-hari option[value="${today}"]`)) {
      document.getElementById('filter-hari').value = today;
    }

    // Jalankan pertama kali saat halaman dibuka
    loadScheduleSiswa();
  </script>
</body>
</html>
