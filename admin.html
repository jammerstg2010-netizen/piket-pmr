<script>
    // 1. FUNGSI LOGIN (SUDAH DISESUAIKAN DENGAN NAMA FUNGSI DI TOMBOL)
    function prosesLogin(e) {
      if (e) e.preventDefault();
      
      const u = document.getElementById('admin-user').value.trim();
      const p = document.getElementById('admin-pass').value.trim();

      if (u === 'adminpmr' && p === 'piketuks2026') {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        initApp();
      } else {
        document.getElementById('login-err').innerText = '❌ Username / Password Salah!';
      }
    }

    // 2. KONEKSI SUPABASE
    const SUPABASE_URL = "https://dnyelqaypfftwswwyure.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRueWVscWF5cGZmdHdzd3d5dXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjY2NzgsImV4cCI6MjEwMjU0MjY3OH0.pce4AoBsxXXUIq5iTjg1PsXWPWmE9OyC_zrH91V5rvg";
    let supabase, membersAll = [];

    async function initApp() {
      try {
        if (window.supabase) {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          await loadMembers();
          await loadJadwalHariIni();
          await loadLogsAdmin();
        }
      } catch (err) {
        console.error("Gagal load Supabase:", err);
      }
    }

    async function loadMembers() {
      const { data } = await supabase.from('members').select('*').order('nama');
      membersAll = data || [];
    }

    function createMemberCard(id, nama, fase) {
      const div = document.createElement('div');
      div.className = 'draggable-card';
      div.draggable = true;
      div.id = `member-${id}`;
      div.dataset.id = id;
      div.ondragstart = (e) => e.dataTransfer.setData("text/plain", id);
      div.innerHTML = `<span><b>${nama}</b></span><span style="color:#3182ce; font-weight:bold;">Fase ${fase}</span>`;
      return div;
    }

    function allowDrop(e) { e.preventDefault(); }
    function drop(e, targetZone) {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain");
      const card = document.getElementById(`member-${id}`);
      if (!card) return;

      if (targetZone === 'Shift Istirahat 1') document.getElementById('target-shift-1').appendChild(card);
      else if (targetZone === 'Shift Istirahat 2') document.getElementById('target-shift-2').appendChild(card);
      else document.getElementById('source-list').appendChild(card);
    }

    async function loadJadwalHariIni() {
      const hari = document.getElementById('select-hari').value;
      const s1 = document.getElementById('target-shift-1');
      const s2 = document.getElementById('target-shift-2');
      s1.innerHTML = ''; s2.innerHTML = '';

      if (hari === 'Jumat') {
        document.getElementById('container-shift-2').style.display = 'none';
      } else {
        document.getElementById('container-shift-2').style.display = 'block';
      }

      const { data } = await supabase.from('piket_schedule').select('*').eq('hari', hari);
      const assignedIds = new Set();

      if (data) {
        data.forEach(item => {
          const member = membersAll.find(m => m.id.toString() === item.member_id.toString());
          if (member) {
            assignedIds.add(member.id.toString());
            const card = createMemberCard(member.id, member.nama, member.fase);
            if (item.shift === 'Shift Istirahat 1') s1.appendChild(card);
            else if (item.shift === 'Shift Istirahat 2' && hari !== 'Jumat') s2.appendChild(card);
          }
        });
      }

      const sourceBox = document.getElementById('source-list');
      sourceBox.innerHTML = '';
      membersAll.forEach(m => {
        if (!assignedIds.has(m.id.toString())) sourceBox.appendChild(createMemberCard(m.id, m.nama, m.fase));
      });
    }

    async function terbitkanJadwal() {
      const hari = document.getElementById('select-hari').value;
      const status = document.getElementById('status-terbit');
      status.style.color = "#3182ce"; status.innerText = "⏳ Sedang menerbitkan...";

      const shift1Cards = document.querySelectorAll('#target-shift-1 .draggable-card');
      const shift2Cards = document.querySelectorAll('#target-shift-2 .draggable-card');

      const payload = [];
      shift1Cards.forEach(c => payload.push({ hari, member_id: c.dataset.id, shift: 'Shift Istirahat 1' }));
      if (hari !== 'Jumat') {
        shift2Cards.forEach(c => payload.push({ hari, member_id: c.dataset.id, shift: 'Shift Istirahat 2' }));
      }

      await supabase.from('piket_schedule').delete().eq('hari', hari);
      if (payload.length > 0) await supabase.from('piket_schedule').insert(payload);

      status.style.color = "#38a169";
      status.innerText = `✅ Jadwal ${hari} berhasil terbit!`;
    }

    async function tambahAnggota() {
      const nama = document.getElementById('nama-baru').value.trim();
      const fase = document.getElementById('fase-baru').value;
      if (!nama) return alert("Masukkan nama!");
      await supabase.from('members').insert([{ nama, fase }]);
      document.getElementById('nama-baru').value = '';
      await loadMembers();
      await loadJadwalHariIni();
    }

    async function loadLogsAdmin() {
      const tbody = document.getElementById('tabel-log-admin');
      const { data: logs } = await supabase.from('piket_logs').select('*').order('id', { ascending: false });

      if (!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada laporan foto.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      logs.forEach(log => {
        const member = membersAll.find(m => m.id.toString() === log.member_id.toString());
        const nama = member ? member.nama : 'Anggota PMR';
        const waktu = new Date(log.created_at || Date.now()).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        tbody.innerHTML += `
          <tr>
            <td>${waktu}</td>
            <td><b>${nama}</b></td>
            <td>${log.shift}</td>
            <td><a href="${log.foto_url}" target="_blank"><img src="${log.foto_url}" class="img-preview"></a></td>
            <td><b>${log.status}</b></td>
            <td>
              <button class="btn btn-green" style="padding:4px 8px; font-size:11px; width:auto;" onclick="updateStatusLog(${log.id}, 'ACC')">ACC</button>
              <button class="btn btn-red" style="padding:4px 8px; font-size:11px; width:auto;" onclick="updateStatusLog(${log.id}, 'Ditolak')">Tolak</button>
            </td>
          </tr>
        `;
      });
    }

    async function updateStatusLog(id, status) {
      await supabase.from('piket_logs').update({ status }).eq('id', id);
      loadLogsAdmin();
    }
  </script>
