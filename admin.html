<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Piket UKS PMR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f4f7f6; min-height: 100vh; padding: 20px; color: #2d3748; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex; justify-content: center; align-items: center; z-index: 99999;
    }
    .login-card {
      background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 360px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .login-card h2 { color: #e53e3e; margin-bottom: 8px; font-size: 20px; font-weight: 800; }
    
    .form-control {
      width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-size: 14px; outline: none; background: #f8fafc; margin-bottom: 12px;
    }
    .btn {
      padding: 12px 16px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px;
      cursor: pointer; transition: all 0.2s; width: 100%; display: block;
    }
    .btn-red { background: #e53e3e; color: white; }
    .btn-blue { background: #3182ce; color: white; }
    .btn-green { background: #38a169; color: white; }
    
    .header-card {
      background: linear-gradient(135deg, #e53e3e 0%, #dd6b20 100%);
      padding: 24px; border-radius: 20px; text-align: center; color: white; margin-bottom: 24px;
    }
    .card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 24px; border: 1px solid #edf2f7; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    .drag-box-container, .shift-target {
      background: #f7fafc; border: 2px dashed #cbd5e0; border-radius: 12px; padding: 12px; min-height: 150px;
    }
    .draggable-card {
      background: white; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin-bottom: 8px;
      cursor: grab; font-size: 13px; display: flex; justify-content: space-between;
    }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; font-size: 13px; border-bottom: 1px solid #edf2f7; text-align: left; }
    .img-preview { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- OVERLAY LOGIN -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>🔐 Login Admin UKS</h2>
      <p style="font-size: 12px; color: #718096; margin-bottom: 16px;">Masukkan Username & Password</p>
      
      <input type="text" id="admin-user" class="form-control" placeholder="Username" autocomplete="off">
      <input type="password" id="admin-pass" class="form-control" placeholder="Password">
      
      <button type="button" id="btn-login-trigger" class="btn btn-red" onclick="prosesLogin()">Masuk Panel Admin</button>
      <div id="login-err" style="color: #e53e3e; font-size: 12px; margin-top: 12px; font-weight: bold;"></div>
    </div>
  </div>

  <!-- ISI DASHBOARD ADMIN -->
  <div class="container" id="admin-content" style="display: none;">
    <div class="header-card">
      <h1>🚑 Panel Admin Piket UKS PMR</h1>
      <p>Kelola Shift Harian & Validasi Laporan Bukti Foto</p>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px; font-size:15px; color:#2b6cb0;">➕ Tambah Anggota PMR</h3>
      <div class="grid-2">
        <input type="text" id="nama-baru" class="form-control" placeholder="Nama Lengkap Siswa..." style="margin-bottom:0;">
        <div style="display: flex; gap: 8px;">
          <select id="fase-baru" class="form-control" style="width: 40%; margin-bottom:0;">
            <option value="E">Fase E</option>
            <option value="F">Fase F</option>
          </select>
          <button type="button" class="btn btn-blue" style="width: 60%;" onclick="tambahAnggota()">Simpan</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size:15px; color:#2b6cb0;">📌 Susun Shift Pertugasan</h3>
        <select id="select-hari" class="form-control" style="width: auto; margin-bottom:0;" onchange="loadJadwalHariIni()">
          <option value="Senin">Senin</option>
          <option value="Selasa">Selasa</option>
          <option value="Rabu">Rabu</option>
          <option value="Kamis">Kamis</option>
          <option value="Jumat">Jumat</option>
        </select>
      </div>

      <div class="grid-2">
        <div>
          <label style="font-size: 12px; font-weight: bold;">📇 Anggota Belum Dijadwalkan:</label>
          <div id="source-list" class="drag-box-container" style="margin-top:6px;" ondrop="drop(event, 'source')" ondragover="allowDrop(event)"></div>
        </div>
        <div>
          <label style="font-size: 12px; font-weight: bold;">⏰ Shift Istirahat 1:</label>
          <div id="target-shift-1" class="shift-target" ondrop="drop(event, 'Shift Istirahat 1')" ondragover="allowDrop(event)"></div>
          
          <div id="container-shift-2" style="margin-top: 12px;">
            <label style="font-size: 12px; font-weight: bold;">⏰ Shift Istirahat 2:</label>
            <div id="target-shift-2" class="shift-target" ondrop="drop(event, 'Shift Istirahat 2')" ondragover="allowDrop(event)"></div>
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-red" style="margin-top: 16px;" onclick="terbitkanJadwal()">🚀 Terbitkan Jadwal Hari Ini</button>
      <div id="status-terbit" style="margin-top: 10px; font-size: 13px; text-align: center; font-weight: bold;"></div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px; font-size:15px; color:#2b6cb0;">📸 Validasi Absen Bukti Foto</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Nama</th>
              <th>Shift</th>
              <th>Foto</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-log-admin">
            <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // LOGIKA LOGIN MURNI JS (TIDAK BERGANTUNG SUPABASE)
    function prosesLogin() {
      const u = document.getElementById('admin-user').value.trim();
      const p = document.getElementById('admin-pass').value.trim();

      if (u === 'adminpmr' && p === 'piketuks2026') {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        initApp();
      } else {
        document.getElementById('login-err').innerText = '❌ Username / Password Salah!';
      }
    }

    // SUPABASE INTEGRATION
    const SUPABASE_URL = "https://dnyelqaypfftwswwyure.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRueWVscWF5cGZmdHdzd3d5dXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjY2NzgsImV4cCI6MjEwMjU0MjY3OH0.pce4AoBsxXXUIq5iTjg1PsXWPWmE9OyC_zrH91V5rvg";
    let supabase, membersAll = [];

    async function initApp() {
      try {
        if (window.supabase) {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          await loadMembers();
          await loadJadwalHariIni();
          await loadLogsAdmin();
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadMembers() {
      const { data } = await supabase.from('members').select('*').order('nama');
      membersAll = data || [];
    }

    function createMemberCard(id, nama, fase) {
      const div = document.createElement('div');
      div.className = 'draggable-card';
      div.draggable = true;
      div.id = `member-${id}`;
      div.dataset.id = id;
      div.ondragstart = (e) => e.dataTransfer.setData("text/plain", id);
      div.innerHTML = `<span><b>${nama}</b></span><span style="color:#3182ce; font-weight:bold;">Fase ${fase}</span>`;
      return div;
    }

    function allowDrop(e) { e.preventDefault(); }
    function drop(e, targetZone) {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain");
      const card = document.getElementById(`member-${id}`);
      if (!card) return;

      if (targetZone === 'Shift Istirahat 1') document.getElementById('target-shift-1').appendChild(card);
      else if (targetZone === 'Shift Istirahat 2') document.getElementById('target-shift-2').appendChild(card);
      else document.getElementById('source-list').appendChild(card);
    }

    async function loadJadwalHariIni() {
      const hari = document.getElementById('select-hari').value;
      const s1 = document.getElementById('target-shift-1');
      const s2 = document.getElementById('target-shift-2');
      s1.innerHTML = ''; s2.innerHTML = '';

      if (hari === 'Jumat') {
        document.getElementById('container-shift-2').style.display = 'none';
      } else {
        document.getElementById('container-shift-2').style.display = 'block';
      }

      const { data } = await supabase.from('piket_schedule').select('*').eq('hari', hari);
      const assignedIds = new Set();

      if (data) {
        data.forEach(item => {
          const member = membersAll.find(m => m.id.toString() === item.member_id.toString());
          if (member) {
            assignedIds.add(member.id.toString());
            const card = createMemberCard(member.id, member.nama, member.fase);
            if (item.shift === 'Shift Istirahat 1') s1.appendChild(card);
            else if (item.shift === 'Shift Istirahat 2' && hari !== 'Jumat') s2.appendChild(card);
          }
        });
      }

      const sourceBox = document.getElementById('source-list');
      sourceBox.innerHTML = '';
      membersAll.forEach(m => {
        if (!assignedIds.has(m.id.toString())) sourceBox.appendChild(createMemberCard(m.id, m.nama, m.fase));
      });
    }

    async function terbitkanJadwal() {
      const hari = document.getElementById('select-hari').value;
      const status = document.getElementById('status-terbit');
      status.style.color = "#3182ce"; status.innerText = "⏳ Sedang menerbitkan...";

      const shift1Cards = document.querySelectorAll('#target-shift-1 .draggable-card');
      const shift2Cards = document.querySelectorAll('#target-shift-2 .draggable-card');

      const payload = [];
      shift1Cards.forEach(c => payload.push({ hari, member_id: c.dataset.id, shift: 'Shift Istirahat 1' }));
      if (hari !== 'Jumat') {
        shift2Cards.forEach(c => payload.push({ hari, member_id: c.dataset.id, shift: 'Shift Istirahat 2' }));
      }

      await supabase.from('piket_schedule').delete().eq('hari', hari);
      if (payload.length > 0) await supabase.from('piket_schedule').insert(payload);

      status.style.color = "#38a169";
      status.innerText = `✅ Jadwal ${hari} berhasil terbit!`;
    }

    async function tambahAnggota() {
      const nama = document.getElementById('nama-baru').value.trim();
      const fase = document.getElementById('fase-baru').value;
      if (!nama) return alert("Masukkan nama!");
      await supabase.from('members').insert([{ nama, fase }]);
      document.getElementById('nama-baru').value = '';
      await loadMembers();
      await loadJadwalHariIni();
    }

    async function loadLogsAdmin() {
      const tbody = document.getElementById('tabel-log-admin');
      const { data: logs } = await supabase.from('piket_logs').select('*').order('id', { ascending: false });

      if (!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada laporan foto.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      logs.forEach(log => {
        const member = membersAll.find(m => m.id.toString() === log.member_id.toString());
        const nama = member ? member.nama : 'Anggota PMR';
        const waktu = new Date(log.created_at || Date.now()).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        tbody.innerHTML += `
          <tr>
            <td>${waktu}</td>
            <td><b>${nama}</b></td>
            <td>${log.shift}</td>
            <td><a href="${log.foto_url}" target="_blank"><img src="${log.foto_url}" class="img-preview"></a></td>
            <td><b>${log.status}</b></td>
            <td>
              <button class="btn btn-green" style="padding:4px 8px; font-size:11px; width:auto;" onclick="updateStatusLog(${log.id}, 'ACC')">ACC</button>
              <button class="btn btn-red" style="padding:4px 8px; font-size:11px; width:auto;" onclick="updateStatusLog(${log.id}, 'Ditolak')">Tolak</button>
            </td>
          </tr>
        `;
      });
    }

    async function updateStatusLog(id, status) {
      await supabase.from('piket_logs').update({ status }).eq('id', id);
      loadLogsAdmin();
    }
  </script>
</body>
</html>
