<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Piket UKS - PMR</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: #f4f7f6;
      background-image: radial-gradient(#cbd5e0 1px, transparent 1px);
      background-size: 20px 20px;
      min-height: 100vh;
      padding: 16px;
      color: #2d3748;
    }

    .container { max-width: 700px; margin: 0 auto; }

    .header-card {
      background: linear-gradient(135deg, #e53e3e 0%, #dd6b20 100%);
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      color: white;
      box-shadow: 0 10px 20px rgba(229, 62, 62, 0.2);
      margin-bottom: 20px;
    }
    .header-card h1 { font-size: 22px; font-weight: 800; }
    .header-card p { font-size: 12px; opacity: 0.9; }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid #edf2f7;
      margin-bottom: 20px;
    }

    .card h2 { font-size: 15px; color: #2b6cb0; margin-bottom: 12px; font-weight: 700; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f7fafc; color: #718096; padding: 10px; font-size: 11px; text-transform: uppercase; }
    td { padding: 10px; font-size: 13px; border-bottom: 1px solid #edf2f7; }

    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; }
    .badge-fase { background: #ebf8ff; color: #2b6cb0; }
    .status-belum { background: #fff5f5; color: #e53e3e; }
    .status-acc { background: #c6f6d5; color: #22543d; }
    .status-pending { background: #feebc8; color: #c05621; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #4a5568; }
    .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 13px; background: white; outline: none; }
    .form-control:focus { border-color: #3182ce; }

    .preview-box {
      width: 100%;
      max-height: 180px;
      border-radius: 10px;
      object-fit: cover;
      margin-top: 8px;
      display: none;
      border: 1px solid #cbd5e0;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #e53e3e 0%, #dd6b20 100%);
      color: white;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-submit:disabled { background: #cbd5e0; cursor: not-allowed; }

    .expired-banner {
      background: #fff5f5;
      border: 1px solid #feb2b2;
      color: #c53030;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <h1>🏥 Absensi Piket UKS PMR</h1>
      <p>Jadwal Pertugasan & Pelaporan Foto Bukti</p>
    </div>

    <!-- TABEL JADWAL HARIAN -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2>📅 Jadwal Piket Harian</h2>
        <select id="filter-hari" class="form-control" style="width: auto; padding: 4px 8px;" onchange="loadScheduleSiswa()">
          <option value="Senin">Senin</option>
          <option value="Selasa">Selasa</option>
          <option value="Rabu">Rabu</option>
          <option value="Kamis">Kamis</option>
          <option value="Jumat">Jumat</option>
        </select>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nama Petugas</th>
              <th>Fase</th>
              <th>Shift</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tabel-piket">
            <tr><td colspan="4" style="text-align: center; color: #a0aec0;">Memuat jadwal...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- FORM SUBMISSION FOTO BUKTI -->
    <div class="card">
      <h2>📸 Unggah Laporan Foto Piket</h2>
      
      <div id="expired-notice" class="expired-banner" style="display: none;">
        ⚠️ Batas pengiriman laporan foto hari ini telah ditutup (Sistem Expired jam 15:00 WIB).
      </div>

      <form id="form-upload">
        <div class="form-group">
          <label>Pilih Nama Kamu (Jadwal Hari Ini):</label>
          <select id="select-member" class="form-control" required onchange="autoFillShift()">
            <option value="">-- Pilih Nama Kamu --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Shift Pertugasan:</label>
          <select id="select-shift" class="form-control" required>
            <option value="Shift Istirahat 1">Shift Istirahat 1</option>
            <option value="Shift Istirahat 2">Shift Istirahat 2</option>
          </select>
        </div>

        <div class="form-group">
          <label>Foto Bukti Kegiatan Piket UKS:</label>
          <input type="file" id="input-foto" class="form-control" accept="image/*" required onchange="previewImage(event)">
          <img id="img-preview" class="preview-box" alt="Preview Foto">
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">🚀 Kirim Laporan Piket</button>
      </form>
      <div id="pesan-status" style="margin-top: 12px; text-align: center; font-size: 12px; font-weight: 700;"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dnyelqaypfftwswwyure.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRueWVscWF5cGZmdHdzd3d5dXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjY2NzgsImV4cCI6MjEwMjU0MjY3OH0.pce4AoBsxXXUIq5iTjg1PsXWPWmE9OyC_zrH91V5rvg";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentSchedule = [];

    function checkExpired() {
      const currentHour = new Date().getHours();
      if (currentHour >= 15) { // Expired setelah jam 15:00 WIB
        document.getElementById('expired-notice').style.display = 'block';
        document.getElementById('btn-submit').disabled = true;
      }
    }

    function previewImage(event) {
      const file = event.target.files[0];
      const preview = document.getElementById('img-preview');
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    }

    async function loadScheduleSiswa() {
      const hari = document.getElementById('filter-hari').value;
      const tbody = document.getElementById('tabel-piket');
      const selectMember = document.getElementById('select-member');

      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #a0aec0;">Memuat jadwal...</td></tr>';
      selectMember.innerHTML = '<option value="">-- Pilih Nama Kamu --</option>';

      const { data: logs } = await supabase.from('piket_logs').select('*');
      const logMap = {};
      if (logs) logs.forEach(l => { logMap[l.member_id] = l.status; });

      const { data: scheduleData } = await supabase
        .from('piket_schedule')
        .select('*, members(id, nama, fase)')
        .eq('hari', hari);

      if (!scheduleData || scheduleData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #a0aec0;">Belum ada jadwal piket hari ${hari}</td></tr>`;
        return;
      }

      currentSchedule = scheduleData;
      tbody.innerHTML = '';

      scheduleData.forEach(item => {
        if (item.members) {
          const m = item.members;
          const statusLog = logMap[m.id];
          let statusBadge = '<span class="badge status-belum">Belum Piket</span>';

          if (statusLog === 'Pending') statusBadge = '<span class="badge status-pending">Menunggu ACC</span>';
          if (statusLog === 'ACC') statusBadge = '<span class="badge status-acc">Sudah ACC</span>';

          tbody.innerHTML += `
            <tr>
              <td><b>${m.nama}</b></td>
              <td><span class="badge badge-fase">Fase ${m.fase}</span></td>
              <td>${item.shift}</td>
              <td>${statusBadge}</td>
            </tr>
          `;

          selectMember.innerHTML += `<option value="${m.id}">${m.nama}</option>`;
        }
      });
    }

    function autoFillShift() {
      const memberId = document.getElementById('select-member').value;
      const target = currentSchedule.find(s => s.member_id.toString() === memberId.toString());
      if (target) {
        document.getElementById('select-shift').value = target.shift;
      }
    }

    document.getElementById('form-upload').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusPesan = document.getElementById('pesan-status');
      statusPesan.style.color = "#3182ce"; statusPesan.innerText = "⏳ Sedang mengunggah foto bukti...";

      const memberId = document.getElementById('select-member').value;
      const shift = document.getElementById('select-shift').value;
      const file = document.getElementById('input-foto').files[0];

      if (!memberId) {
        statusPesan.style.color = "#e53e3e"; statusPesan.innerText = "❌ Pilih nama kamu!";
        return;
      }

      const fileName = `${Date.now()}_${file.name}`;
      const { error: uploadErr } = await supabase.storage.from('bukti-piket').upload(fileName, file);

      if (uploadErr) {
        statusPesan.style.color = "#e53e3e";
        statusPesan.innerText = "❌ Gagal upload foto. Pastikan Bucket Supabase 'bukti-piket' sudah Public!";
        return;
      }

      const fotoUrl = `${SUPABASE_URL}/storage/v1/object/public/bukti-piket/${fileName}`;

      await supabase.from('piket_logs').insert([{
        member_id: memberId,
        shift: shift,
        foto_url: fotoUrl,
        status: 'Pending'
      }]);

      statusPesan.style.color = "#38a169";
      statusPesan.innerText = "✅ Laporan piket berhasil dikirim! Menunggu ACC Admin.";
      document.getElementById('form-upload').reset();
      document.getElementById('img-preview').style.display = 'none';
      loadScheduleSiswa();
    });

    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const today = days[new Date().getDay()];
    if (document.querySelector(`#filter-hari option[value="${today}"]`)) {
      document.getElementById('filter-hari').value = today;
    }

    checkExpired();
    loadScheduleSiswa();
  </script>
</body>
</html>
